services:
  camera-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepstream-camera-api
    image: deepstream-camera-api:latest
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    
    restart: unless-stopped
    runtime: nvidia
    stdin_open: true
    tty: true