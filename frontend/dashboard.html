<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live People Count Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .timestamp {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .cameras-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .camera-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .camera-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .camera-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f3f4f6;
        }

        .camera-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .camera-id {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1f2937;
        }

        .count-display {
            text-align: center;
        }

        .count-label {
            font-size: 0.85rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .count-value {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .no-data {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Live People Count Dashboard</h1>
            <div class="timestamp" id="lastUpdate">Loading...</div>
            <div class="status">
                <span class="status-dot"></span>
                <span>Live Updates</span>
            </div>
        </header>

        <div id="dashboard">
            <div class="loading">⏳ Connecting to server...</div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'http://localhost:8000/analytics/live/people-count';
        const POLL_INTERVAL = 3000; // 3 seconds

        let pollTimer = null;

        function formatTimestamp(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function renderCameras(data) {
            const dashboard = document.getElementById('dashboard');
            const lastUpdate = document.getElementById('lastUpdate');

            lastUpdate.textContent = `Last updated: ${formatTimestamp(data.timestamp)}`;

            if (!data.cameras || data.cameras.length === 0) {
                dashboard.innerHTML = `
                    <div class="no-data">
                        <h3>No Camera Data Available</h3>
                        <p>Waiting for camera streams to send data...</p>
                    </div>
                `;
                return;
            }

            const camerasHTML = data.cameras.map(camera => `
                <div class="camera-card">
                    <div class="camera-header">
                        <div class="camera-icon">📹</div>
                        <div class="camera-id">${camera.camera_id}</div>
                    </div>
                    <div class="count-display">
                        <div class="count-label">People Count</div>
                        <div class="count-value">${camera.people_count}</div>
                    </div>
                </div>
            `).join('');

            dashboard.innerHTML = `<div class="cameras-grid">${camerasHTML}</div>`;
        }

        function showError(message) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = `
                <div class="error-message">
                    <strong>⚠️ Error:</strong> ${message}
                </div>
            `;
        }

        async function fetchData() {
            try {
                const response = await fetch(API_ENDPOINT);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                renderCameras(data);
            } catch (error) {
                console.error('Fetch error:', error);
                showError(error.message || 'Failed to connect to backend server');
            }
        }

        function startPolling() {
            // Initial fetch
            fetchData();

            // Poll every POLL_INTERVAL
            pollTimer = setInterval(fetchData, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        // Handle visibility change to pause/resume polling
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopPolling();
            } else {
                startPolling();
            }
        });

        // Start polling when page loads
        window.addEventListener('load', startPolling);

        // Cleanup on page unload
        window.addEventListener('beforeunload', stopPolling);
    </script>
</body>
</html>
